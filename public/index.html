<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des data centers — Québec &amp; Canada</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-sombre">

  <div id="map"></div>

  <!-- Panneau de filtres (overlay) -->
  <div id="filters">
    <button id="btn-theme" onclick="basculerFond()">☀️ Carte claire</button>
    <h2>Filtres</h2>

    <section id="filters-type">
      <h3>Type</h3>
      <!-- Cases générées dynamiquement par app.js -->
    </section>

    <section id="filters-hebergeur">
      <h3>Hébergeur</h3>
      <!-- Cases générées dynamiquement par app.js -->
    </section>

    <section id="filters-polygones">
      <h3>Bâtiments</h3>
      <!-- Case générée dynamiquement par app.js -->
    </section>

    <section id="filters-electricite">
      <h3>Réseau Électrique</h3>
      <div id="btn-hq-lines" class="filter-item active">Lignes de transport</div>
      <div id="btn-hq-nodes" class="filter-item active">Postes électriques</div>
      <div class="hq-legend">
        <div class="hq-legend-title">Tension (kV)</div>
        <div class="hq-legend-item" data-voltage="735">
          <span class="hq-legend-color color-735"></span>
          <span>735 kV</span>
        </div>
        <div class="hq-legend-item" data-voltage="315">
          <span class="hq-legend-color color-315"></span>
          <span>315 - 450 kV</span>
        </div>
        <div class="hq-legend-item" data-voltage="230">
          <span class="hq-legend-color color-230"></span>
          <span>230 kV</span>
        </div>
        <div class="hq-legend-item" data-voltage="120">
          <span class="hq-legend-color color-120"></span>
          <span>120 - 161 kV</span>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
