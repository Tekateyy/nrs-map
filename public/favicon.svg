<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pink-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#334155" stroke-width="4" opacity="0.3" />

  <!-- Grid Pattern / Connection Lines in Background -->
  <g opacity="0.15" stroke="#4facfe" stroke-width="2">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="10 15" />
    <circle cx="256" cy="256" r="120" fill="none" stroke-dasharray="5 5" />
    <line x1="256" y1="50" x2="256" y2="462" />
    <line x1="50" y1="256" x2="462" y2="256" />
    <line x1="110" y1="110" x2="402" y2="402" />
    <line x1="110" y1="402" x2="402" y2="110" />
  </g>

  <!-- Stylized Network Nodes -->
  <g filter="url(#glow-heavy)">
    <!-- Central Datacenter Node (Isometric Cube) -->
    <!-- Top Face -->
    <path d="M256 160 L340 200 L256 240 L172 200 Z" fill="url(#cyan-blue)" />
    <!-- Left Face -->
    <path d="M172 208 L256 248 L256 340 L172 300 Z" fill="#3b82f6" opacity="0.85" />
    <!-- Right Face -->
    <path d="M256 248 L340 208 L340 300 L256 340 Z" fill="#1d4ed8" opacity="0.95" />

    <!-- Circuit/Connection lines originating from center -->
    <path d="M256 340 L256 410 L370 410" fill="none" stroke="#ff0844" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M172 200 L100 200 L60 260" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M340 200 L412 200 L452 260" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Outer Nodes -->
    <circle cx="370" cy="410" r="14" fill="url(#pink-purple)" />
    <circle cx="60" cy="260" r="14" fill="url(#cyan-blue)" />
    <circle cx="452" cy="260" r="14" fill="url(#green-glow)" />
    
    <!-- Pulse rings around nodes -->
    <circle cx="256" cy="200" r="28" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" />
  </g>
</svg>
